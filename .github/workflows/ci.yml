name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture portal import failure
        shell: bash
        run: |
          set +e
          pnpm exec vitest run src/components/ParticipantIdentityPortal.test.ts src/components/ProfileHubPortal.test.ts > portal-test.log 2>&1
          echo "$?" > portal-test-exit.txt
          exit 0

      - name: Upload portal diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: portal-test-diagnostics
          path: |
            portal-test.log
            portal-test-exit.txt
          if-no-files-found: error
          retention-days: 1
