name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose lint
        run: |
          git clone --depth 1 --branch feat/event-location-map-picker https://github.com/vitvolny26-art/GO-IRL-1.0.git source
          cd source
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm install --frozen-lockfile --reporter=silent
          pnpm run lint
