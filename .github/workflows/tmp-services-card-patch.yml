name: One-time Services card patch

on:
  push:
    branches:
      - fix/services-card-compact-date-picker-20260803

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/services-card-compact-date-picker-20260803
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/services/ServiceActivityCard.tsx')
          text = path.read_text()
          replacements = [
              ('  const cardDate = useTodayKey();', '  const todayDate = useTodayKey();\n  const [cardDate, setCardDate] = useState(todayDate);\n  const [compactCalendarOpen, setCompactCalendarOpen] = useState(false);'),
              ('  useEffect(() => {\n    setBookingDate(cardDate);', '  useEffect(() => {\n    if (cardDate < todayDate) setCardDate(todayDate);\n  }, [cardDate, todayDate]);\n\n  useEffect(() => {\n    setBookingDate(cardDate);'),
              ('  const isSelectableDate = (date: string) => date >= cardDate', '  const isSelectableDate = (date: string) => date >= todayDate'),
              ('    if (nextKey < cardDate.slice(0, 7)) return;', '    if (nextKey < todayDate.slice(0, 7)) return;'),
              ('disabled={calendarMonth <= cardDate.slice(0, 7)}', 'disabled={calendarMonth <= todayDate.slice(0, 7)}'),
              ('min={cardDate.slice(0, 7)}', 'min={todayDate.slice(0, 7)}'),
              ('event.target.value || cardDate.slice(0, 7)', 'event.target.value || todayDate.slice(0, 7)'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing replacement target: {old[:80]}')
              text = text.replace(old, new)
          marker = '  const moveMonth = (offset: number) => {'
          insert = '  const chooseCardDate = (date: string) => {\n    if (!isSelectableDate(date)) return;\n    const slots = freeSlotsFor(date, professional.profileId);\n    setCardDate(date);\n    setBookingDate(date);\n    setTime(slots[0] || "");\n    setBookingSent(false);\n    setCompactCalendarOpen(false);\n  };\n\n'
          text = text.replace(marker, insert + marker)
          old_meta = '        <div className="service-meta-item"><CalendarDays /><strong>{formatCompactDate(cardDate, language)}</strong></div>'
          new_meta = '        <button className="service-meta-item service-meta-date-item" type="button" aria-expanded={compactCalendarOpen} onClick={() => { setCalendarMonth(cardDate.slice(0, 7)); setCompactCalendarOpen((value) => !value); }}><CalendarDays /><strong>{formatCompactDate(cardDate, language)}</strong></button>'
          if old_meta not in text:
              raise SystemExit('missing date meta block')
          text = text.replace(old_meta, new_meta)
          old_actions = '      </div>\n      <div className="services-professional-actions"><button className="secondary" type="button" onClick={() => setDetailsOpen(true)}><Info />{labels.details}</button><button className="primary" type="button" onClick={() => openBooking()}><CalendarPlus />{labels.book}</button></div>'
          calendar = '      </div>\n      {compactCalendarOpen && <div className="service-card-calendar-popover" role="dialog" aria-label={labels.chooseDate}>\n        <div className="service-card-calendar-toolbar">\n          <button type="button" aria-label={labels.previousMonth} onClick={() => moveMonth(-1)} disabled={calendarMonth <= todayDate.slice(0, 7)}><ChevronLeft /></button>\n          <strong>{new Intl.DateTimeFormat(locale[language], { month: "long", year: "numeric" }).format(parseDateKey(`${calendarMonth}-01`))}</strong>\n          <button type="button" aria-label={labels.nextMonth} onClick={() => moveMonth(1)}><ChevronRight /></button>\n        </div>\n        <div className="service-card-calendar-weekdays">{weekdayLabels.map((label, index) => <span key={`compact-${label}-${index}`}>{label}</span>)}</div>\n        <div className="service-card-calendar-grid">{days.map((date, index) => date ? <button\n          className={date === cardDate ? "is-selected" : ""}\n          type="button"\n          key={`compact-${date}`}\n          disabled={!isSelectableDate(date)}\n          onClick={() => chooseCardDate(date)}\n        >{parseDateKey(date).getDate()}</button> : <span key={`compact-empty-${index}`} />)}</div>\n      </div>}\n      <div className="services-professional-actions"><button className="secondary" type="button" onClick={() => setDetailsOpen(true)}><Info />{labels.details}</button><button className="primary" type="button" onClick={() => openBooking()}><CalendarPlus />{labels.book}</button></div>'
          if old_actions not in text:
              raise SystemExit('missing actions insertion point')
          text = text.replace(old_actions, calendar)
          path.write_text(text)

          css = Path('src/services/service-activity-card.css')
          css_text = css.read_text()
          override = '''
          /* Compact Services metadata and in-card date picker. */
          .service-activity-card .services-professional-meta{bottom:76px;grid-template-columns:52px 82px 88px minmax(0,1fr)!important}
          .service-professional-meta-row>button,.service-professional-meta-row>div{min-height:60px;align-items:center!important;justify-content:center!important;padding:22px 6px 5px!important;text-align:center!important}
          .service-professional-meta-row .service-meta-item svg{top:5px;left:50%;transform:translateX(-50%)}
          .service-professional-meta-row .service-meta-item strong{display:block;overflow:hidden;font-size:14px!important;line-height:1.05;text-align:center;text-overflow:ellipsis;white-space:nowrap!important}
          .service-professional-meta-row .service-meta-date-item strong{font-size:15px!important}
          .service-professional-meta-row .service-meta-item:last-child strong{display:-webkit-box;font-size:13px!important;line-height:1.08;white-space:normal!important;-webkit-box-orient:vertical;-webkit-line-clamp:2}
          .service-master-avatar{min-height:60px!important;padding:5px!important}
          .service-activity-card .services-professional-actions{bottom:14px}
          .service-activity-card .services-professional-actions button{min-height:48px!important}
          .service-card-calendar-popover{position:absolute;right:15%;bottom:146px;left:15%;z-index:30;display:grid;gap:6px;padding:10px;border:1px solid #d4af37;border-radius:16px;background:#160b20f5;color:#fff;box-shadow:0 18px 46px #000b}
          .service-card-calendar-toolbar{display:grid;grid-template-columns:30px 1fr 30px;align-items:center;gap:6px}
          .service-card-calendar-toolbar button{display:grid;width:30px;height:30px;place-items:center;border:1px solid #70587a;border-radius:9px;background:transparent;color:#d4af37}
          .service-card-calendar-toolbar button:disabled{opacity:.3}
          .service-card-calendar-toolbar strong{overflow:hidden;font-size:12px;text-align:center;text-overflow:ellipsis;white-space:nowrap;text-transform:capitalize}
          .service-card-calendar-weekdays,.service-card-calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
          .service-card-calendar-weekdays span{font-size:8px;text-align:center;text-transform:uppercase;color:#baa9bf}
          .service-card-calendar-grid>button,.service-card-calendar-grid>span{min-width:0;min-height:26px}
          .service-card-calendar-grid>button{display:grid;place-items:center;border:1px solid #4f3858;border-radius:7px;background:transparent;color:#fff;font-size:10px;font-weight:850}
          .service-card-calendar-grid>button.is-selected{border-color:#d4af37;background:#d4af37;color:#211126}
          .service-card-calendar-grid>button:disabled{border-color:#302535;color:#665a69;opacity:.55}
          @media(max-width:420px){
            .service-activity-card .services-professional-meta{bottom:72px;grid-template-columns:46px 76px 82px minmax(0,1fr)!important}
            .service-professional-meta-row>button,.service-professional-meta-row>div{min-height:58px;padding:21px 4px 4px!important}
            .service-professional-meta-row .service-meta-item strong{font-size:13px!important}
            .service-professional-meta-row .service-meta-item:last-child strong{font-size:12px!important}
            .service-master-avatar{min-height:58px!important}
            .service-card-calendar-popover{right:15%;bottom:138px;left:15%;padding:8px}
          }
          '''
          css.write_text(css_text.rstrip() + '\n' + override)
          PY
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run test
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-services-card-patch.yml
          git add src/services/ServiceActivityCard.tsx src/services/service-activity-card.css
          git commit -m "Refine Services metadata and compact date picker"
          git push origin HEAD:fix/services-card-compact-date-picker-20260803
