name: Apply UX regression pack

on:
  push:
    branches:
      - tmp/apply-ux-regression-pack-20260726
    paths:
      - ".tmp/**"
      - ".github/workflows/apply-ux-regression-pack.yml"
  pull_request:
    branches:
      - fix/ux-regression-pack
    paths:
      - ".tmp/**"
      - ".github/workflows/apply-ux-regression-pack.yml"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch source
        uses: actions/checkout@v5
        with:
          ref: tmp/apply-ux-regression-pack-20260726
          path: patches

      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: fix/ux-regression-pack
          path: repo
          fetch-depth: 0

      - name: Verify expected PR head
        working-directory: repo
        run: test "$(git rev-parse HEAD)" = "e76f2451c8fa0003105a66d780b3987f02654779"

      - name: Apply map patch
        working-directory: repo
        run: git apply --check ../patches/.tmp/ux-map.patch && git apply ../patches/.tmp/ux-map.patch

      - name: Prepare exact non-Sport weather patch
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("patches/.tmp/ux-weather.patch").read_text()
          marker = "diff --git a/src/verticals/SportVertical.tsx b/src/verticals/SportVertical.tsx\n"
          start = source.index(marker)
          next_marker = "diff --git a/src/weather-ui-fixes.css b/src/weather-ui-fixes.css\n"
          end = source.index(next_marker, start)
          Path("weather-non-sport.patch").write_text(source[:start] + source[end:])
          PY

      - name: Apply non-Sport weather patch
        working-directory: repo
        run: git apply --check ../weather-non-sport.patch && git apply ../weather-non-sport.patch

      - name: Apply Sport weather patch
        working-directory: repo
        run: git apply --check ../patches/.tmp/ux-weather-sport.patch && git apply ../patches/.tmp/ux-weather-sport.patch

      - name: Apply organizer patch
        working-directory: repo
        run: git apply --check ../patches/.tmp/ux-organizer.patch && git apply ../patches/.tmp/ux-organizer.patch

      - name: Apply select patch
        working-directory: repo
        run: |
          git apply --check ../patches/.tmp/ux-select.patch
          git apply ../patches/.tmp/ux-select.patch
          python - <<'PY'
          from pathlib import Path
          test = Path("src/components/ProfilePreferencesPortal.test.ts")
          test.write_text(test.read_text().replace(
              'import { visiblePreferenceOptions } from "./ProfilePreferencesPortal";',
              'import { visiblePreferenceOptions } from "../profilePreferenceOptions";',
          ))
          portal = Path("src/components/ProfilePreferencesPortal.tsx")
          text = portal.read_text()
          text = text.replace(
              'import { useAppStore } from "../store";\n',
              'import { useAppStore } from "../store";\nimport { visiblePreferenceOptions, type PreferenceOption } from "../profilePreferenceOptions";\n',
          )
          text = text.replace('type PreferenceOption = { value: string; label: string; disabled?: boolean };\n', '')
          text = text.replace('export const visiblePreferenceOptions = (options: PreferenceOption[]) => options.filter((option) => !option.disabled);\n\n', '')
          portal.write_text(text)
          Path("src/profilePreferenceOptions.ts").write_text(
              'export type PreferenceOption = { value: string; label: string; disabled?: boolean };\n\n'
              'export const visiblePreferenceOptions = (options: PreferenceOption[]) => options.filter((option) => !option.disabled);\n'
          )
          PY

      - name: Verify patch whitespace
        working-directory: repo
        run: git diff --check

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: repo/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: repo
        run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: repo
        run: set -o pipefail; pnpm run test 2>&1 | tee test-output.txt

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staged-test-output
          path: repo/test-output.txt
          if-no-files-found: ignore

      - name: Typecheck
        working-directory: repo
        run: pnpm run typecheck

      - name: Lint
        working-directory: repo
        run: pnpm run lint

      - name: Build
        working-directory: repo
        run: pnpm run build

      - name: Create atomic commit
        if: github.event_name == 'push'
        working-directory: repo
        run: |
          git config user.name "GO IRL AI Fixer"
          git config user.email "actions@users.noreply.github.com"
          git add src
          git commit -m "fix: apply event details UX regression pack"
          git push origin HEAD:fix/ux-regression-pack
