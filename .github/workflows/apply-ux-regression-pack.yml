name: Verify final UX regression pack

on:
  push:
    branches:
      - tmp/apply-ux-regression-pack-20260726
    paths:
      - ".github/workflows/apply-ux-regression-pack.yml"
  pull_request:
    branches:
      - fix/ux-regression-pack
    paths:
      - ".github/workflows/apply-ux-regression-pack.yml"

permissions:
  contents: read

jobs:
  verify-final-head:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v5
        with:
          ref: fix/ux-regression-pack
          fetch-depth: 0

      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "5f36cd898a03bd4a55d91b839433b86d87048bdc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm run test

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
