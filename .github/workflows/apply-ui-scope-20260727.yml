name: Apply UI scope 20260727

on:
  push:
    branches:
      - fix/ui-event-sheet-profile-20260727

permissions:
  contents: write

jobs:
  apply-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/apply-ui-scope-20260727.cjs
      - run: rm scripts/apply-ui-scope-20260727.cjs .github/workflows/apply-ui-scope-20260727.yml
      - run: pnpm run test
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run build
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src api scripts .github
          git commit -m "fix: align event UI and share card"
          git push
