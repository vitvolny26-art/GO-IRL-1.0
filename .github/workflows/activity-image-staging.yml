name: Activity image asset staging

on:
  push:
    branches:
      - fix/activity-image-assets-20260808

permissions:
  contents: write

jobs:
  finalize-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild bounded image patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images/activities/icons
          cat .asset-staging/icon-36-drawing.b64.* | base64 -d > images/activities/icons/36-drawing.webp
          echo '9992b9116a6a346c6a96bc5eb90734d3eea2820d1e1b267631d1de79eee4fbad  images/activities/icons/36-drawing.webp' | sha256sum -c -
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import sharp from 'sharp';

          const cards = [
            '22-festival.webp',
            '23-dancing.webp',
            '33-language-exchange.webp',
            '36-drawing.webp',
            '37-photo-walk.webp',
            '38-ceramics.webp',
          ];
          for (const file of cards) {
            const path = `images/activities/cards-3x4/${file}`;
            const before = await sharp(path).metadata();
            if (before.width !== 1024 || before.height !== 1536) {
              throw new Error(`${file}: expected 1024x1536 source, got ${before.width}x${before.height}`);
            }
            const tmp = `${path}.tmp.webp`;
            await sharp(path)
              .resize({
                width: 1080,
                height: 1440,
                fit: 'contain',
                background: { r: 10, g: 14, b: 16, alpha: 1 },
              })
              .webp({ quality: 92, effort: 6 })
              .toFile(tmp);
            await fs.rename(tmp, path);
            const after = await sharp(path).metadata();
            if (after.width !== 1080 || after.height !== 1440 || after.format !== 'webp') {
              throw new Error(`${file}: invalid output ${after.width}x${after.height} ${after.format}`);
            }
          }
          const icon = await sharp('images/activities/icons/36-drawing.webp').metadata();
          if (icon.width !== 384 || icon.height !== 384 || icon.format !== 'webp') {
            throw new Error(`icon: invalid output ${icon.width}x${icon.height} ${icon.format}`);
          }
          NODE
          sha256sum \
            images/activities/cards-3x4/22-festival.webp \
            images/activities/cards-3x4/23-dancing.webp \
            images/activities/cards-3x4/33-language-exchange.webp \
            images/activities/cards-3x4/36-drawing.webp \
            images/activities/cards-3x4/37-photo-walk.webp \
            images/activities/cards-3x4/38-ceramics.webp \
            images/activities/icons/36-drawing.webp

      - name: Remove transport and commit final assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .asset-staging
          rm -f .github/workflows/activity-image-staging.yml
          git config user.name 'GO IRL Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          test "$(git diff --cached --name-only | wc -l)" -eq 11
          git commit -m 'Fix activity image assets'
          git push origin HEAD:fix/activity-image-assets-20260808
