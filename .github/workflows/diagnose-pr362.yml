name: Diagnose PR 362

on:
  pull_request:
    branches: [main]

jobs:
  capture-test-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture test output
        shell: bash
        run: |
          set +e
          pnpm run test > pr362-test.log 2>&1
          echo "$?" > pr362-test-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pr362-test-diagnostics
          path: |
            pr362-test.log
            pr362-test-exit.txt
          if-no-files-found: error
          retention-days: 1
