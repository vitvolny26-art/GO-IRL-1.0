name: Diagnose PR 362

on:
  pull_request:
    branches: [main]

jobs:
  capture-test-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture test output
        shell: bash
        run: |
          set +e
          pnpm run test > pr362-test.log 2>&1
          status=$?
          echo "$status" > pr362-test-exit.txt
          exit 0

      - name: Upload test diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: pr362-test-diagnostics
          path: |
            pr362-test.log
            pr362-test-exit.txt
          if-no-files-found: error
          retention-days: 1
